name: munbat_ai
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter  
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  flutter_svg: ^2.2.3
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  camera: ^0.11.3
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.7.4
  flutter_bloc: ^8.1.6
  characters: ^1.3.0
  url_launcher: ^6.2.6
  device_info_plus: ^10.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  # FILS LIKE  IMAGES AND ICONS
  assets:
    - assets/images/
    - assets/images/main_images/
    - assets/images/plants_images/
    - assets/animations/
    - assets/icons/

  # FONTS  
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa/Comfortaa-Light.ttf
        - asset: assets/fonts/Comfortaa/Comfortaa-Regular.ttf
        - asset: assets/fonts/Comfortaa/Comfortaa-Medium.ttf
        - asset: assets/fonts/Comfortaa/Comfortaa-Bold.ttf
        - asset: assets/fonts/Comfortaa/Comfortaa-SemiBold.ttf

    
 